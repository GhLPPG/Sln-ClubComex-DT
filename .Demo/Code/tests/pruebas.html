<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Pruebas de negocio - Sln.ClubComex</title>
  <style>body{font-family:Segoe UI,Arial,sans-serif;margin:20px}.ok{color:#17794a}.fail{color:#b42318;font-weight:bold}td,th{border-bottom:1px solid #ddd;padding:4px 8px;text-align:left}</style>
</head>
<body>
  <h1>Pruebas de aceptación (capa LBusiness/LData)</h1>
  <p>Ejecuta <code>ClubComex.Acceptance.ejecutar()</code> sobre almacenamiento en memoria. Funciona con file://.</p>
  <div id="resumen"></div>
  <table id="tabla"><thead><tr><th>ID</th><th>Trazabilidad</th><th>Resultado</th><th>Detalle</th></tr></thead><tbody></tbody></table>
  <script src="../js/lcommon.js"></script>
  <script src="../js/ldata.js"></script>
  <script src="../js/lbusiness.js"></script>
  <script src="../js/acceptance.js"></script>
  <script>
    (function () {
      var r = ClubComex.Acceptance.ejecutar();
      var ok = r.filter(function (x) { return x.ok; }).length;
      var tb = document.querySelector('#tabla tbody');
      r.forEach(function (x) {
        var tr = document.createElement('tr');
        tr.innerHTML = '<td>' + x.id + '</td><td>' + x.trazabilidad + '</td><td class="' + (x.ok ? 'ok' : 'fail') + '">' + (x.ok ? 'PASS' : 'FAIL') + '</td><td></td>';
        tr.lastChild.textContent = x.detalle; tb.appendChild(tr);
      });
      var res = document.getElementById('resumen');
      res.id = 'resumen'; res.textContent = 'RESULTADO: ' + ok + '/' + r.length + (ok === r.length ? ' PASS' : ' FAIL');
      document.title = res.textContent;
    })();
  </script>
</body>
</html>
